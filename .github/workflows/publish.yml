# Stages a release on npm on a v* tag, through npm trusted publishing (OIDC):
# no token is stored anywhere. Staged, not published: the trusted publisher on
# npmjs.com allows `npm stage publish` only, so nothing reaches customers until
# a maintainer runs `npm stage approve` with 2FA. The publisher must name this
# repository (owner `AddressFinder`, case-sensitive) and this workflow file.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm stage publish
